<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f4a35">
<title>Planner</title>
<meta name="application-name" content="Planner">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/planner-192.png">
<link rel="icon" sizes="192x192" href="icons/planner-192.png">
<script src="https://natesteele888.github.io/apps/install.js" defer></script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4a35'/%3E%3Cpath d='M18 22h28M18 32h28M18 42h18' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#1c2420;--mute:#6c716b;--line:#e3dccd;--chip:#eee7d8;--green:#1f4a35;--accent:#2f7a52;--red:#b3362e;--okbg:#e4f1e8;--warnbg:#fbeee2;--blue:#2b5ba8;--bluebg:#e7eefb;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(30,40,30,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#111613;--card:#1a211d;--ink:#edf0ea;--mute:#9aa49c;--line:#2a332e;--chip:#25302a;--green:#163a29;--accent:#5fb487;--red:#e3675f;--okbg:#1d3326;--warnbg:#3a2a1d;--blue:#8fb3ef;--bluebg:#1e2b40;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:44px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:auto;min-height:0}
input[type=color]{width:44px;padding:2px;flex:none}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 0}
label>input,label>select,label>textarea{margin-top:4px;color:var(--ink);font-size:15px}
h2{margin:0;font-size:19px}h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--mute)}.sm{font-size:13px}.warn{color:var(--red)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end}.row input{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:42px;text-decoration:none;font-size:14px}
.btn.sm{padding:6px 12px;font-size:13px;min-height:34px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.claude{background:#c96442;color:#fff}
.btn.danger{background:var(--red)}
.btn.wide{width:100%;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:0;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--green);color:#fff}
.lchips{margin-top:12px;flex-wrap:wrap}.chip small{opacity:.75;font-size:12px}.chip.add{background:none;border:1px dashed var(--line)}
.lacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.split{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mute)}.split b{color:var(--ink)}.tag.who{background:var(--bluebg);color:var(--blue)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--kc)}
.tag{font-size:11.5px;padding:3px 8px;border-radius:7px;background:var(--chip);white-space:nowrap}
.tag.order{background:var(--okbg);color:var(--accent);font-weight:600}.tag.now{background:var(--warnbg);color:var(--red);font-weight:600}
.tag.s-ordered{background:var(--bluebg);color:var(--blue)}.tag.s-here{background:#fff3d6;color:#8a6410}.tag.s-wrapped{background:var(--okbg);color:var(--accent)}
@media (prefers-color-scheme:dark){.tag.s-here{background:#3a301a;color:#e9c46a}}

.top{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.ttl{font-weight:700;font-size:18px}.sub{font-size:12px;opacity:.8}
.icon{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;width:42px;height:42px;font-size:18px;cursor:pointer}
main{max-width:680px;margin:0 auto;padding:6px 14px calc(100px + env(safe-area-inset-bottom))}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mute);gap:1px;cursor:pointer;padding:4px 0}
.tabs button b{font-size:20px;font-weight:400}.tabs button.on{color:var(--accent);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}

.kidhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-left:5px solid var(--kc);padding-left:10px}
.tot{text-align:right}.tot b{font-size:22px;display:block;line-height:1.1}.tot small{color:var(--mute);font-size:12px}
.bud{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:10px}.bud i{display:block;height:100%;background:var(--kc)}.bud.over i{background:var(--red)}
.item{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.thumb{position:relative;width:72px;height:72px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-size:26px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.thumb[data-act=zoom]{cursor:zoom-in}
.zoom{display:block;width:100%;max-height:60vh;object-fit:contain;background:#fff;border-radius:12px;margin:0 0 12px}
.it{font-weight:600;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;font-size:12.5px;color:var(--mute);margin-top:5px}
.price{font-weight:700;color:var(--ink);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warnbg);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px}
.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.idea{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.idea:first-of-type{border-top:0}
.idea .ib{flex:1}.idea b{display:block;line-height:1.25}.idea small{color:var(--mute);display:block;margin-top:2px}
.idea .acts{margin-top:6px}
.idea .x{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;padding:0 4px}
.idea.done{opacity:.55}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tld{position:relative;margin:0 0 14px}
.tld::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--mute)}
.tld.sale::before{border-color:var(--accent);background:var(--accent)}.tld.dead::before{border-color:var(--red);background:var(--red)}
.tld.today::before{border-color:var(--blue);background:var(--blue);width:12px;height:12px;left:-20px}
.tld.past{opacity:.5}
.tdate{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.tev{font-weight:600;margin-top:2px}.tev.sale{color:var(--accent)}.tev.dead{color:var(--red)}.tev.today{color:var(--blue)}
.tit{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0;cursor:pointer}
.tit small{color:var(--mute)}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.sheet[hidden],.modal[hidden],#app[hidden],.lock[hidden]{display:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.sbody{flex:1;overflow-y:auto;padding:4px 16px 40px;max-width:680px;width:100%;margin:0 auto}
.lab{font-size:13px;color:var(--mute);margin:12px 0 4px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg label{flex:1;margin:0}.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px 4px;border-radius:9px;font-size:13px;color:var(--ink);cursor:pointer}
.seg input:checked+span{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.photo{display:flex;gap:12px;align-items:center;margin-top:12px}
.photo img,.photo .ph{width:100px;height:100px;border-radius:14px;object-fit:contain;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:34px;flex:none}
.pbtn{display:flex;flex-wrap:wrap;gap:6px}.pbtn label{margin:0}
.hint{background:var(--okbg);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}
.mbox{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:400px}
.mbox p{margin:0 0 10px}
.kidpick{display:grid;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}

.lock{position:fixed;inset:0;z-index:100;background:var(--green);color:#fff;display:grid;place-items:center;padding:20px}
.lk{width:100%;max-width:320px;text-align:center}
.lk h1{margin:10px 0 2px;font-size:22px}.lk p{margin:0;opacity:.85;min-height:21px}
.lic{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.14);display:grid;place-items:center;margin:0 auto;font-size:28px}
.dots{display:flex;gap:12px;justify-content:center;margin:22px 0;height:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}.dots i.f{background:#fff;border-color:#fff}
.dots.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:64px;width:64px;justify-self:center;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:24px;cursor:pointer}
.pad button.t{background:none;font-size:15px}
.pad .enter{grid-column:1/-1;width:100%;border-radius:999px;height:48px;font-size:16px;font-weight:600;background:rgba(255,255,255,.2)}
</style>
</head>
<body>

<div id="lock" class="lock">
 <div class="lk">
  <div class="lic">🔒</div>
  <h1 id="lockTitle">Planner</h1>
  <p id="lockMsg">Loading…</p>
  <div id="dots" class="dots"></div>
  <div class="pad" id="pad">
   <button data-pin="1">1</button><button data-pin="2">2</button><button data-pin="3">3</button>
   <button data-pin="4">4</button><button data-pin="5">5</button><button data-pin="6">6</button>
   <button data-pin="7">7</button><button data-pin="8">8</button><button data-pin="9">9</button>
   <button data-pin="bio" class="t" id="bioBtn" aria-label="Use fingerprint">👆</button><button data-pin="0">0</button><button data-pin="del" class="t" aria-label="Delete">⌫</button>
   <button data-pin="ok" class="enter" id="enterBtn">Enter</button>
  </div>
 </div>
</div>

<div id="app" hidden>
 <header class="top"><div><div class="ttl" id="ttl">Planner</div><div class="sub" id="sub"></div></div><button class="icon" data-act="lockNow" aria-label="Lock">🔒</button></header>
 <main id="view"></main>
 <button class="fab" id="fab" data-act="new" aria-label="Add gift">+</button>
 <nav class="tabs" id="tabs">
  <button data-tab="lists"><b>🎁</b>Lists</button>
  <button data-tab="find"><b>🔎</b>Find & ideas</button>
  <button data-tab="when"><b>📅</b>When to order</button>
  <button data-tab="more"><b>⚙️</b>More</button>
 </nav>
</div>

<div id="sheet" class="sheet" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const money=n=>{const v=+n||0;return '$'+v.toLocaleString(undefined,{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dd=(a,b)=>Math.round((b-a)/864e5);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fdD=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fdW=d=>d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const enc=new TextEncoder(),dec=new TextDecoder();
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
function b64(buf){const u=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2600)}

/* ---------- constants ---------- */
const TYPES={big:{l:'Big gift',i:'⭐'},gift:{l:'Gift',i:'🎁'},stocking:{l:'Stocking',i:'🧦'}};
const STATUS={idea:'Idea',ordered:'Ordered',here:'Here',wrapped:'Wrapped'};
const NEXT={idea:['ordered','Ordered ✓'],ordered:['here','It’s here ✓'],here:['wrapped','Wrapped ✓']};
const STORES=[['Amazon','https://www.amazon.com/s?k='],['Target','https://www.target.com/s?searchTerm='],['Walmart','https://www.walmart.com/search?q='],['Dick’s','https://www.dickssportinggoods.com/search/SearchDisplay?searchTerm='],['Google Shopping','https://www.google.com/search?tbm=shop&q='],['eBay','https://www.ebay.com/sch/i.html?_nkw=']];

/* ---------- storage ---------- */
const KV=(()=>{let dbp=null;const open=()=>dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('planner',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
 const ls={get:k=>{try{const v=localStorage.getItem('pl_'+k);return v?JSON.parse(v):undefined}catch{return undefined}},set:(k,v)=>localStorage.setItem('pl_'+k,JSON.stringify(v))};
 return{async get(k){try{const db=await open();return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch{return ls.get(k)}},
 async set(k,v){try{const db=await open();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch{ls.set(k,v)}}}})();

const newItem=p=>Object.assign({id:uid(),kid:'',list:'',who:'',ref:'',name:'',url:'',asin:'',img:'',price:'',store:'',type:'gift',status:'idea',orderOn:'',saleNote:'',eta:'',note:'',created:Date.now()},p||{});
function defState(){const Y=new Date().getMonth()===0?new Date().getFullYear()-1:new Date().getFullYear();
 return{v:2,settings:{year:Y,arriveBy:Y+'-12-20',shipDays:5,title:'Planner',autoLock:true,lastBackup:null,dirty:false,sel:{}},
 kids:[{id:'k1',name:'Kid 1',age:'',color:'#2e6fb4',budget:'',activities:''},{id:'k2',name:'Kid 2',age:'',color:'#b0447e',budget:'',activities:''}],
 lists:[],items:[],ideas:[]}}
function fromV1(o){const d=defState();if(!o)return d;d.kids=(o.kids||d.kids).map(k=>({id:k.id,name:k.name,age:k.age,color:k.color,budget:+((k.budget||{}).total)||'',activities:(k.activities||[]).join(', ')}));
 const st={idea:'idea',list:'idea',bought:'ordered',shipped:'ordered',arrived:'here',wrapped:'wrapped',staged:'wrapped'};
 d.items=(o.items||[]).map(i=>newItem({id:i.id,kid:i.kid,name:i.name,url:i.url,asin:i.asin,img:i.img,price:i.paid||i.est||'',store:i.retailer||'',type:i.cat||'gift',status:st[i.status]||'idea',eta:i.eta||'',note:i.notes||''}));
 if(o.settings){d.settings.lastBackup=o.settings.lastBackup||null;d.settings.title=o.settings.title||'Planner'}return d}
function migrate(d){const def=defState();d.settings=Object.assign(def.settings,d.settings||{});d.kids=d.kids&&d.kids.length?d.kids:def.kids;d.items=(d.items||[]).map(i=>Object.assign(newItem(),i));d.ideas=d.ideas||def.ideas;d.lists=Array.isArray(d.lists)?d.lists:[];d.settings.sel=d.settings.sel&&typeof d.settings.sel==='object'?d.settings.sel:{};return d}

let S=null,L=null,unlocked=false,pendingImport=null;
const U={tab:'lists',kid:'all',f:'all',bio:false};
let saveT=null;
function save(clean){if(!clean)S.settings.dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,200)}
async function flush(){clearTimeout(saveT);if(S)try{await KV.set('state2',S)}catch(e){toast('Could not save: '+e.message)}}

/* ---------- gift math ---------- */
const kidOf=id=>S.kids.find(k=>k.id===id);
const kidByName=n=>{n=String(n||'').trim().toLowerCase();return n?S.kids.find(k=>k.name.toLowerCase()===n||k.name.toLowerCase().startsWith(n)):null};
/* named lists: an item with no list is on the kid's Main list */
const MAIN='Main list';
const listOf=id=>S.lists.find(l=>l.id===id);
const listsOf=kid=>S.lists.filter(l=>l.kid===kid);
const listName=lid=>lid?((listOf(lid)||{}).name||MAIN):MAIN;
const selList=kid=>{const v=S.settings.sel[kid]||'';return v&&listOf(v)?v:''};
const inList=(i,lid)=>(i.list||'')===lid;
const active=i=>inList(i,selList(i.kid));
function listByName(kid,name,make){name=String(name||'').trim();if(!name||/^main( list)?$/i.test(name))return '';let l=S.lists.find(x=>x.kid===kid&&x.name.toLowerCase()===name.toLowerCase());if(!l&&make){l={id:uid(),kid,name};S.lists.push(l)}return l?l.id:''}
const asinOf=u=>{const m=String(u||'').match(/(?:\/dp\/|\/gp\/product\/|\/gp\/aw\/d\/|[?&]asin=)([A-Z0-9]{10})/i);return m?m[1].toUpperCase():''};
const storeOf=u=>{try{const h=new URL(u).hostname.replace(/^www\./,'');if(/amazon|amzn|a\.co/.test(h))return 'Amazon';const p=h.split('.');return p[p.length-2].replace(/^./,c=>c.toUpperCase())}catch{return ''}};
const amzImg=a=>`https://m.media-amazon.com/images/P/${a}.01._SCLZZZZZZZ_SX400_.jpg`;
const imgOf=i=>i.img||(i.asin?amzImg(i.asin):'');
const Y=()=>+S.settings.year;
const arrive=()=>pd(S.settings.arriveBy);
const lastSafe=()=>addD(arrive(),-(+S.settings.shipDays||5));

function sugg(i){const t=today(),s=SALES(),last=lastSafe();
 if(i.orderOn)return{d:pd(i.orderOn),why:i.saleNote||'Your date',set:true};
 const tx=(i.name+' '+i.url+' '+i.store).toLowerCase(),amz=/amazon|amzn/.test(tx)||!!i.asin;let d,why,dig=false;
 if(/v-?bucks|gift ?card|subscription|ticket|lesson|crew|coupon|outing/.test(tx)){dig=true;d=new Date(Y(),11,23);why='Digital or experience — no shipping needed'}
 else if(/cleat|batting glove|receiver glove|shoe|sneaker|jersey|hoodie|jacket|pants|shirt|leotard/.test(tx)){d=t;why='Sizes sell out — order now'}
 else if(i.type==='stocking'||(+i.price&&+i.price<20)){d=s.cm;why=amz?'Small item — bundle into one order on the last day of Amazon’s sale':'Small item — bundle it into a Cyber Monday order'}
 else if(amz&&i.type!=='big'){d=s.amzStart;why='Amazon Black Friday Week starts — deals run through Nov 30'}
 else{d=s.bf;why='Black Friday — deepest cuts on bigger items'}
 if(d<t){d=t;why=t>last&&!dig?'Past the safe shipping day — fast shipping or buy in store':'Sale already started — order now'}

 return{d,why,set:false}}

function parseImport(txt){const s=String(txt||''),a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<a)return null;try{const o=JSON.parse(s.slice(a,b+1));return(o.items||o.ideas||o.kids)?o:null}catch{return null}}

 if(r.price!=null&&r.price!==''&&+r.price)o.price=String(+r.price);if(TYPES[r.type])o.type=r.type;if(r.status&&ST_IN[String(r.status).toLowerCase()])o.status=ST_IN[String(r.status).toLowerCase()];
 if(o.orderOn&&!/^\d{4}-\d\d-\d\d$/.test(o.orderOn))delete o.orderOn;if(o.eta&&!/^\d{4}-\d\d-\d\d$/.test(o.eta))delete o.eta;

async function applyImport(o){let add=0,upd=0,idn=0,kn=0;
 (o.kids||[]).forEach((r,x)=>{if(!r||!r.name)return;let k=kidByName(r.name)||(r.slot&&S.kids[r.slot-1])||null;if(!k){k={id:uid(),name:'',age:'',color:['#2e6fb4','#b0447e','#2f7a52','#c27c0e'][S.kids.length%4],budget:'',activities:''};S.kids.push(k)}k.name=String(r.name);if(r.age!=null)k.age=r.age;if(r.activities!=null)k.activities=String(r.activities);if(r.color)k.color=r.color;kn++});
 const touched=new Map();
 for(const r of o.items||[]){const c=cleanIn(r),ln=String((r.list!=null&&r.list!=='')?r.list:(o.list||'')).trim();
  let ex=r.id&&S.items.find(x=>x.id===r.id),k=kidByName(r.kid);
  if(!ex&&ln){if(!k&&c.name)k=await chooseKid(c.name);if(!k)continue;c.list=listByName(k.id,ln,true);touched.set(k.id,c.list);
   const pool=S.items.filter(x=>x.kid===k.id&&inList(x,c.list));ex=(c.ref&&pool.find(x=>x.ref===c.ref))||(c.url&&pool.find(x=>x.url===c.url))}
  else if(!ex){ex=(c.ref&&S.items.find(x=>x.ref&&x.ref===c.ref))||(c.url&&S.items.find(x=>x.url&&x.url===c.url))}
  else if(ln){const kk=k||kidOf(ex.kid);if(kk){c.list=listByName(kk.id,ln,true);touched.set(kk.id,c.list)}}
  if(ex){Object.assign(ex,c);if(k)ex.kid=k.id;upd++;continue}
  if(!c.name)continue;if(!k)k=await chooseKid(c.name);if(!k)continue;S.items.push(newItem(Object.assign({list:selList(k.id)},c,{kid:k.id})));add++}
 touched.forEach((l,kid)=>S.settings.sel[kid]=l);
 for(const r of o.ideas||[]){if(!r.name||S.ideas.some(x=>x.name===r.name&&(kidByName(r.kid)||{}).id===x.kid))continue;const k=kidByName(r.kid)||await chooseKid(r.name);if(!k)continue;S.ideas.unshift({id:uid(),kid:k.id,name:String(r.name),type:TYPES[r.type]?r.type:'gift',why:String(r.why||''),search:String(r.search||r.name),price:+r.price||'',url:String(r.url||''),hidden:false,fromClaude:true});idn++}
 save();render();toast([kn&&plural(kn,'kid')+' set up',add&&plural(add,'gift')+' added',upd&&plural(upd,'gift')+' updated',idn&&plural(idn,'idea')+' added',touched.size&&'on '+[...new Set(touched.values())].map(listName).join(', ')].filter(Boolean).join(' · ')||'Nothing new in that code')}

 <section class="card"><button class="btn ghost sm" data-act="reseed">Bring back dismissed ideas</button> <button class="btn danger sm" data-act="reset">Erase everything</button></section>`}

const VIEWS={lists:vLists,find:vFind,when:vWhen,more:vMore};
function render(top){if(!unlocked)return;const n=dd(today(),new Date(Y(),11,25)),all=S.items.filter(active).reduce((s,i)=>s+(+i.price||0),0);
 document.title=$('#ttl').textContent=S.settings.title||'Planner';$('#sub').textContent=`${money(all)} total · ${n>0?plural(n,'day')+' to go':'Merry Christmas'}`;
 $('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===U.tab));$('#fab').hidden=U.tab==='more';

/* ---------- editor ---------- */
let E=null;
function sheetOpen(){const sh=$('#sheet');if(sh.hidden){try{history.pushState({sheet:1},'')}catch{}}sh.hidden=false;document.body.classList.add('noscroll')}
function closeSheet(fromPop){const sh=$('#sheet');if(sh.hidden)return;sh.hidden=true;sh.innerHTML='';E=null;document.body.classList.remove('noscroll');if(!fromPop){try{if(history.state&&history.state.sheet)history.back()}catch{}}}
window.addEventListener('popstate',()=>closeSheet(true));
function openEditor(id,preset){const b=id?S.items.find(x=>x.id===id):null;const nk=U.kid!=='all'?U.kid:S.kids[0].id;E=b?JSON.parse(JSON.stringify(b)):newItem(Object.assign({kid:nk,list:selList(nk)},preset||{}));E._new=!b;drawEditor()}
function drawEditor(){const i=E,body=$('#sheet .sbody'),sc=body?body.scrollTop:0,img=imgOf(i),g=sugg(i);
 const seg=(name,opts,val)=>`<div class="seg">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${esc(v)}" ${String(val)===String(v)?'checked':''}><span>${l}</span></label>`).join('')}</div>`;
 $('#sheet').innerHTML=`<div class="sh"><button class="btn ghost sm" data-act="close">Cancel</button><b>${i._new?'Add a gift':'Gift'}</b><button class="btn sm" data-act="save">Save</button></div><div class="sbody">
 ${i._new?'<label>Paste a link first — store and photo fill in<input name="url" type="url" inputmode="url" placeholder="https://…" value="'+esc(i.url)+'"></label>':''}
 <div class="photo">${img?`<img src="${esc(img)}" alt="" referrerpolicy="no-referrer">`:`<div class="ph">${TYPES[i.type].i}</div>`}
  <div class="pbtn"><label class="btn ghost sm" style="color:var(--ink)">📷 Photo<input type="file" id="imgFile" accept="image/*" hidden></label><button class="btn ghost sm" data-act="imgUrl">Image link</button>${i.img?'<button class="btn ghost sm" data-act="imgClr">Remove</button>':''}</div></div>
 <label>What is it?<input name="name" value="${esc(i.name)}" placeholder="Gift name"></label>
 <div class="lab">For</div>${seg('kid',S.kids.map(k=>[k.id,esc(k.name)]),i.kid)}
 ${listsOf(i.kid).length?`<div class="lab">List</div>${seg('list',[['',MAIN]].concat(listsOf(i.kid).map(l=>[l.id,esc(l.name)])),i.list||'')}`:''}
 <div class="grid2"><label>Price<input name="price" type="number" inputmode="decimal" step="0.01" value="${esc(i.price)}" placeholder="0"></label><label>Store<input name="store" value="${esc(i.store)}"></label></div>
 <div class="lab">Type</div>${seg('type',Object.entries(TYPES).map(([v,o])=>[v,o.l]),i.type)}
 <div class="lab">Who gets it</div>${seg('who',[['','Not set']].concat(WHO().map(w=>[w,esc(w)])),i.who||'')}
 <div class="lab">Status</div>${seg('status',Object.entries(STATUS),i.status)}
 ${i.status==='idea'?`<label>Order on<input name="orderOn" type="date" value="${esc(i.orderOn)}"></label>${g.set?(i.saleNote?`<div class="hint"><span>${esc(i.saleNote)}</span></div>`:''):`<div class="hint"><span>Suggested <b>${fdW(g.d)}</b> — ${esc(g.why)}</span><button class="btn sm" data-act="useSugg">Use</button></div>`}`:''}
 ${i.status==='ordered'?`<label>Arrives<input name="eta" type="date" value="${esc(i.eta)}"></label>${i.eta&&pd(i.eta)>arrive()?`<p class="warn sm">That’s after ${fdD(arrive())} — consider a backup plan.</p>`:''}`:''}
 ${i._new?'':`<label>Link<input name="url" type="url" inputmode="url" value="${esc(i.url)}" placeholder="https://…"></label>`}
 <div class="row wrap">${i.url?`<a class="btn ghost sm" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">Open link ↗</a>`:''}${i.name?`<a class="btn ghost sm" href="${STORES[4][1]+encodeURIComponent(i.name)}" target="_blank" rel="noopener noreferrer">Compare prices ↗</a>`:''}${i.asin?`<a class="btn ghost sm" href="https://camelcamelcamel.com/product/${i.asin}" target="_blank" rel="noopener noreferrer">Price history ↗</a>`:''}</div>
 <label>Note<textarea name="note" placeholder="Size, color, hiding spot…" style="min-height:60px">${esc(i.note)}</textarea></label>
 ${i._new?'':'<button class="btn danger wide" data-act="del">Delete</button>'}</div>`;
 sheetOpen();const nb=$('#sheet .sbody');if(nb)nb.scrollTop=sc}
function saveItem(){if(!E.name.trim())return toast('Give it a name first');const x=Object.assign({},E);delete x._new;const ix=S.items.findIndex(y=>y.id===x.id);if(ix>=0)S.items[ix]=x;else S.items.push(x);save();closeSheet();render();toast('Saved')}
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
$('#sheet').addEventListener('input',e=>{const el=e.target;if(E&&el.name&&el.type!=='radio')E[el.name]=el.value});
$('#sheet').addEventListener('change',async e=>{const el=e.target;if(el.id==='imgFile'&&el.files[0]){try{E.img=await compress(el.files[0]);drawEditor()}catch{toast('Could not read that image')}return}
 if(!E||!el.name)return;E[el.name]=el.value;
 if(el.name==='kid'&&E.list&&(listOf(E.list)||{}).kid!==E.kid)E.list=selList(E.kid);
 if(el.name==='url'){E.asin=asinOf(el.value);if(!E.store)E.store=storeOf(el.value);if(/amzn\.to|a\.co\//.test(el.value))toast('Short Amazon link — open it and copy the full link for the photo')}
 if(['url','status','type','orderOn','eta','kid'].includes(el.name))drawEditor()});

/* ---------- modal ---------- */
function modal(html,textMode){return new Promise(res=>{const m=$('#modal');m.innerHTML=`<div class="mbox">${html}</div>`;m.hidden=false;const inp=$('input,textarea',m);
 const done=v=>{m.hidden=true;m.innerHTML='';res(v)};
 m.onclick=async e=>{const b=e.target.closest('[data-m]');if(!b){if(e.target===m)done(null);return}const v=b.dataset.m;
  if(v==='clip'){try{$('#pasteBox').value=await navigator.clipboard.readText()}catch{toast('Long-press the box and tap Paste')}return}
  if(v==='cancel')return done(null);if(v==='ok')return done(inp?inp.value:true);done(v)};
 if(inp&&!textMode){setTimeout(()=>inp.focus(),50);inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value)}}})}
const ask=(label,type='text',val='')=>modal(`<p>${esc(label)}</p><input type="${type}" ${type==='password'?'inputmode="numeric" autocomplete="off"':''} value="${esc(val)}"><div class="row end"><button data-m="cancel" class="btn ghost sm">Cancel</button><button data-m="ok" class="btn sm">OK</button></div>`);
const confirmM=t=>modal(`<p>${esc(t)}</p><div class="row end"><button data-m="cancel" class="btn ghost sm">Cancel</button><button data-m="ok" class="btn sm">Yes</button></div>`).then(v=>v!==null);

/* ---------- actions ---------- */
function doSearch(q,x){q=String(q||'').trim();if(!q)return toast('Type what you’re looking for');window.open(STORES[x][1]+encodeURIComponent(q),'_blank','noopener')}
document.addEventListener('click',async e=>{if(!unlocked)return;const el=e.target.closest('[data-act],[data-tab]');if(!el||el.closest('#modal'))return;
 if(el.dataset.tab&&!el.dataset.act){U.tab=el.dataset.tab;render(true);return}
 const a=el.dataset.act,id=el.dataset.id,it=id?S.items.find(x=>x.id===id):null,idea=id?S.ideas.find(x=>x.id===id):null;
 switch(a){
 case 'edit':openEditor(id);break;
 case 'who':{const w=WHO(),n=w.indexOf(it.who);it.who=n<0?w[0]:(n+1<w.length?w[n+1]:'');save();render()}break;
 case 'zoom':{const src=it&&imgOf(it);if(!src){openEditor(id);break}
  modal(`<img class="zoom" src="${esc(src)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<p class=muted>The photo didn’t load. Open the store page to see it.</p>'"><p><b>${esc(it.name)}</b>${+it.price?' · '+money(it.price):''}${it.store?' · '+esc(it.store):''}</p><div class="row end">${it.url?`<a class="btn ghost sm" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">Open store page ↗</a>`:''}<button data-m="ok" class="btn sm">Close</button></div>`)}break;
 case 'new':openEditor();break;
 case 'close':closeSheet();break;
 case 'save':saveItem();break;
 case 'del':if(await confirmM('Delete this gift?')){S.items=S.items.filter(x=>x.id!==E.id);save();closeSheet();render()}break;
 case 'useSugg':E.orderOn=iso(sugg(E).d);E.saleNote=sugg(Object.assign({},E,{orderOn:''})).why;drawEditor();break;
 case 'adv':{it.status=el.dataset.to;if(it.status==='ordered'){const d=await ask('Delivery date? (you can skip)','date',it.eta||'');if(d)it.eta=d;if(!+it.price){const p=await ask('What did you pay?','number');if(p)it.price=p}}save();render();toast(STATUS[it.status]+' ✓')}break;
 case 'kid':U.kid=el.dataset.v;render();break;
 case 'f':U.f=el.dataset.v;render();break;
 case 'lsel':S.settings.sel[el.dataset.k]=el.dataset.v;save(true);render();break;
 case 'lnew':{const k=kidOf(el.dataset.k),n=await ask('Name the new list for '+k.name+' (like Bat list)');if(!n||!n.trim())break;S.settings.sel[k.id]=listByName(k.id,n,true);save();render();toast(listName(S.settings.sel[k.id])+' ready — tap + to add gifts')}break;
 case 'lren':{const lid=selList(el.dataset.k),l=listOf(lid);if(!l)break;const n=await ask('New name for this list','text',l.name);if(n&&n.trim()){l.name=n.trim();save();render()}}break;
 case 'ldel':{const kid=el.dataset.k,lid=selList(kid),l=listOf(lid);if(!l)break;const n=S.items.filter(i=>i.kid===kid&&inList(i,lid)).length;
  if(!(await confirmM(`Delete ${l.name}${n?' and its '+plural(n,'gift'):''}? Your other lists stay as they are.`)))break;
  S.items=S.items.filter(i=>!(i.kid===kid&&inList(i,lid)));S.lists=S.lists.filter(x=>x.id!==lid);const nx=listsOf(kid)[0];S.settings.sel[kid]=nx?nx.id:'';save();render();toast(l.name+' deleted')}break;
 case 'lclr':{const kid=el.dataset.k,n=S.items.filter(i=>i.kid===kid&&!i.list).length;if(!n)break;
  if(!(await confirmM(`Clear ${MAIN}? This deletes its ${plural(n,'gift')}. Your other lists stay as they are.`)))break;
  S.items=S.items.filter(i=>!(i.kid===kid&&!i.list));const nx=listsOf(kid)[0];if(nx)S.settings.sel[kid]=nx.id;save();render();toast(MAIN+' cleared')}break;
 case 'search':U.q=$('#q').value;doSearch(U.q,+el.dataset.i);break;
 case 'isearch':doSearch(idea.search||idea.name,+el.dataset.s);break;
 case 'iadd':S.items.push(newItem({kid:idea.kid,list:selList(idea.kid),name:idea.name,type:idea.type,price:idea.price||'',url:idea.url||'',asin:asinOf(idea.url),store:storeOf(idea.url)}));save();render();toast('Added to '+kidOf(idea.kid).name+'’s list — tap it to add a link & price');break;
 case 'ihide':idea.hidden=true;save();render();break;
 case 'reseed':S.ideas.forEach(x=>x.hidden=false);save();toast('Ideas restored');break;
 case 'cShot':toClaude(pShot());break;
 case 'cIdeas':toClaude(pIdeas(S.kids.find(k=>k.id===id)));break;
 case 'cSales':if(!S.items.some(i=>i.status==='idea'))return toast('Add some gifts first');toClaude(pSales());break;
 case 'paste':pasteFlow();break;
 case 'imgUrl':{const u=await ask('Paste an image link (long-press a product photo → Copy image link)','url');if(u&&u.trim()){E.img=u.trim();drawEditor()}}break;
 case 'imgClr':E.img='';drawEditor();break;
 case 'lockNow':lock();break;
 case 'exp':exportBackup(false);break;
 case 'share':exportBackup(true);break;
 case 'bioOn':try{await bioEnroll();toast('Fingerprint on ✓')}catch{toast('Fingerprint setup cancelled')}render();break;
 case 'bioOff':delete L.cred;await KV.set('lock',L);render();break;
 case 'chpin':await changePin();break;
 case 'reset':if(await confirmM('Erase every gift and setting?')&&await confirmM('Really? This can’t be undone without a backup.')){S=defState();save();render()}break;
 }});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){U.q=e.target.value;doSearch(U.q,0)}});
document.addEventListener('change',e=>{if(!unlocked)return;const el=e.target;if(el.closest('#sheet')||el.closest('#modal'))return;
 if(el.id==='imp'&&el.files[0]){restoreBackup(el.files[0]);el.value='';return}
 if(el.dataset.k){const k=kidOf(el.dataset.k);k[el.dataset.f]=el.value;save();render();return}
 if(el.dataset.s){S.settings[el.dataset.s]=el.type==='checkbox'?el.checked:el.value;save();render()}});

/* ---------- lock ---------- */
let pinBuf='',lockMode='unlock',firstPin='',fails=0,waitUntil=0;
async function sha(s){if(crypto.subtle)return b64(await crypto.subtle.digest('SHA-256',enc.encode(s)));let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}return 'f'+(h1>>>0).toString(16)+(h2>>>0).toString(16)}
const checkPin=async p=>!!L&&(await sha(L.salt+p))===L.hash;
async function bioAvail(){try{return !!(window.PublicKeyCredential&&window.isSecureContext&&/^https?:$/.test(location.protocol)&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch{return false}}
async function bioEnroll(){const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:S.settings.title||'Planner'},user:{id:rnd(16),name:'planner',displayName:'Planner'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},attestation:'none',timeout:60000}});L.cred=b64(c.rawId);await KV.set('lock',L)}
async function bioUnlock(){if(!L||!L.cred||unlocked)return;try{const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(L.cred),transports:['internal']}],userVerification:'required',timeout:60000}});if(new Uint8Array(a.response.authenticatorData)[32]&4)unlock();else lockRender('Use your PIN')}catch{lockRender('Use your fingerprint or PIN')}}
function lockRender(msg){const max=lockMode==='unlock'&&L?L.len:6;$('#lockTitle').textContent=(S&&S.settings.title)||'Planner';
 $('#lockMsg').textContent=msg||(lockMode==='setup'?'Create a 4–6 digit PIN':lockMode==='confirm'?'Enter the same PIN again':'Enter your PIN');
 let d='';for(let i=0;i<Math.max(4,max);i++)d+=`<i class="${i<pinBuf.length?'f':''}"></i>`;$('#dots').innerHTML=d;
 $('#bioBtn').style.visibility=lockMode==='unlock'&&L&&L.cred&&U.bio?'visible':'hidden';$('#enterBtn').hidden=lockMode==='unlock'}
function shake(){const d=$('#dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}
async function pinSubmit(){const p=pinBuf;
 if(lockMode==='setup'){if(p.length<4){shake();return lockRender('Use at least 4 digits')}firstPin=p;pinBuf='';lockMode='confirm';return lockRender()}
 if(lockMode==='confirm'){if(p!==firstPin){pinBuf='';firstPin='';lockMode='setup';shake();return lockRender('Didn’t match — start again')}
  const salt=b64(rnd(16));L={salt,hash:await sha(salt+p),len:p.length};await KV.set('lock',L);pinBuf='';await unlock();
  if(U.bio&&await confirmM('Unlock with your fingerprint from now on?')){try{await bioEnroll();toast('Fingerprint on ✓')}catch{}}return}
 if(Date.now()<waitUntil){pinBuf='';return lockRender('Too many tries — wait a moment')}
 if(await checkPin(p)){fails=0;pinBuf='';unlock()}else{fails++;pinBuf='';shake();if(fails>=5){waitUntil=Date.now()+30000;fails=0;lockRender('Too many tries — wait 30 seconds')}else lockRender('Wrong PIN')}}
function padPress(k){if(k==='bio')return bioUnlock();if(k==='del'){pinBuf=pinBuf.slice(0,-1);return lockRender()}if(k==='ok')return pinSubmit();if(pinBuf.length>=6)return;pinBuf+=k;lockRender();if(lockMode==='unlock'&&L&&pinBuf.length===L.len)pinSubmit()}
$('#pad').addEventListener('click',e=>{const b=e.target.closest('[data-pin]');if(b)padPress(b.dataset.pin)});
document.addEventListener('keydown',e=>{if(unlocked||$('#lock').hidden)return;if(/^\d$/.test(e.key))padPress(e.key);else if(e.key==='Backspace')padPress('del');else if(e.key==='Enter')padPress('ok')});
async function unlock(){unlocked=true;$('#lock').hidden=true;$('#app').hidden=false;render(true);try{if(navigator.storage&&!(await navigator.storage.persisted()))navigator.storage.persist()}catch{}
 if(pendingImport){const o=pendingImport;pendingImport=null;await applyImport(o)}}
function lock(){if(!L)return;flush();unlocked=false;closeSheet(true);$('#modal').hidden=true;$('#view').innerHTML='';$('#app').hidden=true;$('#lock').hidden=false;lockMode='unlock';pinBuf='';lockRender()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){flush();if(unlocked&&S.settings.autoLock)lock()}else if(!unlocked&&L&&L.cred&&U.bio)bioUnlock()});
async function changePin(){const cur=await ask('Current PIN','password');if(cur===null)return;if(!(await checkPin(cur)))return toast('Wrong PIN');
 const n1=await ask('New PIN (4–6 digits)','password');if(!/^\d{4,6}$/.test(n1||''))return toast('Use 4–6 digits');const n2=await ask('Enter it again','password');if(n1!==n2)return toast('Didn’t match');
 L.salt=b64(rnd(16));L.hash=await sha(L.salt+n1);L.len=n1.length;await KV.set('lock',L);toast('PIN changed. Older backups open with the old PIN.')}

/* ---------- backup ---------- */
async function deriveKey(pin,salt){const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function exportBackup(share){const pin=await ask('Enter your PIN to lock the backup file','password');if(pin===null)return;if(!(await checkPin(pin)))return toast('Wrong PIN');
 await flush();const at=new Date().toISOString();let out;
 if(crypto.subtle){const salt=rnd(16),iv=rnd(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(pin,salt),enc.encode(JSON.stringify(S)));out={app:'planner',v:2,enc:true,at,salt:b64(salt),iv:b64(iv),data:b64(ct)}}
 else{if(!(await confirmM('Opened this way the backup can’t be encrypted, so it will be readable. Save anyway?')))return;out={app:'planner',v:2,enc:false,at,data:S}}
 const name=`planner-backup-${iso(new Date())}.json`,file=new File([JSON.stringify(out)],name,{type:'application/json'});let ok=false;
 if(share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});ok=true}catch(e){if(e.name==='AbortError')return}}
 if(!ok){const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
 S.settings.lastBackup=iso(new Date());S.settings.dirty=false;save(true);render();toast('Backup saved ✓')}
async function restoreBackup(f){let o;try{o=JSON.parse(await f.text())}catch{return toast('That isn’t a backup file')}if(!o||o.app!=='planner')return toast('That isn’t a Planner backup');
 let data;if(o.enc){const pin=await ask('PIN that was set when this backup was made','password');if(pin===null)return;try{data=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await deriveKey(pin,unb64(o.salt)),unb64(o.data))))}catch{return toast('Wrong PIN for that backup')}}else data=o.data;
 if(!data||!Array.isArray(data.items))return toast('Backup looks empty');
 if(!(await confirmM(`Replace what's here with the backup from ${new Date(o.at).toLocaleDateString()} (${plural(data.items.length,'gift')})?`)))return;
 S=migrate(data.v===2?data:fromV1(data));save(true);render();toast('Restored ✓')}

/* ---------- boot ---------- */
function readHash(){if(!location.hash.startsWith('#import='))return null;let o=null;try{o=parseImport(dec.decode(unb64(location.hash.slice(8))))}catch{}try{history.replaceState(null,'',location.pathname+location.search)}catch{}return o}
window.addEventListener('hashchange',()=>{const o=readHash();if(!o)return;if(unlocked)applyImport(o);else{pendingImport=o;lockRender('Unlock to add what Claude sent')}});
(async()=>{
 pendingImport=readHash();
 let st=null;try{st=await KV.get('state2')}catch{}if(!st){let v1=null;try{v1=await KV.get('state')}catch{}st=fromV1(v1)}S=migrate(st);
 try{L=(await KV.get('lock'))||null}catch{L=null}
 U.bio=await bioAvail();lockMode=L?'unlock':'setup';lockRender(pendingImport?'Unlock to add what Claude sent':'');
 if(L&&L.cred&&U.bio)bioUnlock()})();
</script>
